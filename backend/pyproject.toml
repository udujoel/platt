[project]
name = "platt-backend"
version = "0.2.0"
description = "Phase 1 FastAPI backend skeleton for Platt."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.79.0",
    "openai>=1.50.0",
    "fastapi>=0.116.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.8.0",
    "python-hcl2>=8.0.0,<9",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
